services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: finguard
      POSTGRES_PASSWORD: finguard
      POSTGRES_DB: finguard
    ports:
      - "54329:5432"
    volumes:
      - ./deploy/postgres/init.sql:/docker-entrypoint-initdb.d/01-role.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finguard -d finguard"]
      interval: 2s
      timeout: 5s
      retries: 30
